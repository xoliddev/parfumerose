<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ro'yxatdan o'tish</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 1s linear;
      background: linear-gradient(120deg, #4e54c8, #8f94fb);
    }
    .container {
      background: rgba(255,255,255,0.85);
      border-radius: 18px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
      padding: 36px 32px 28px 32px;
      min-width: 320px;
      max-width: 90vw;
      text-align: center;
    }
    h2 {
      margin-bottom: 18px;
      color: #222;
      letter-spacing: 1px;
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 2px 8px #fff8;
    }
    label {
      display: block;
      margin: 16px 0 6px 0;
      font-size: 1.1rem;
      color: #222;
      font-weight: 500;
    }
    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 1rem;
      margin-bottom: 10px;
      background: #f9f9f9;
      color: #222;
      outline: none;
      transition: border 0.2s;
    }
    input[type="text"]:focus, input[type="tel"]:focus {
      border: 1.5px solid #4e54c8;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 12px 0;
      background: linear-gradient(90deg, #4e54c8, #8f94fb);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      box-shadow: 0 2px 8px #4e54c822;
      transition: background 0.3s;
    }
    button:hover {
      background: linear-gradient(90deg, #8f94fb, #4e54c8);
    }
    .success {
      color: #2e7d32;
      font-weight: 600;
      margin-top: 18px;
      font-size: 1.1rem;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Ro'yxatdan o'tish</h2>
    <form id="registerForm">
      <label for="name">Ismingiz</label>
      <input type="text" id="name" name="name" placeholder="Ismingizni kiriting" required autocomplete="off">
      <label for="phone">Telefon raqamingiz</label>
      <input type="tel" id="phone" name="phone" placeholder="99 123 45 67" pattern="[0-9 ]{9,15}" required autocomplete="off">
      <button type="submit">Yuborish</button>
    </form>
    <div class="success" id="successMsg" style="display:none;">Muvaffaqiyatli ro'yxatdan o'tdingiz!</div>
  </div>
  <script>
    // Ranglarni RGB formatida aniqlaymiz
    const gradients = [
      [[78,84,200], [143,148,251]],
      [[67,206,162], [24,90,157]],
      [[249,151,30], [255,210,0]],
      [[249,83,198], [185,29,115]],
      [[0,195,255], [255,255,28]],
      [[252,70,107], [63,94,251]],
      [[17,153,142], [56,239,125]],
      [[238,9,121], [255,106,0]]
    ];
    let current = 0;
    let next = 1;
    let step = 0;
    const steps = 300; // Qancha ko'proq bo'lsa, shuncha sekin o'zgaradi

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function getGradient(c1, c2, t) {
      const color1 = [
        Math.round(lerp(c1[0][0], c2[0][0], t)),
        Math.round(lerp(c1[0][1], c2[0][1], t)),
        Math.round(lerp(c1[0][2], c2[0][2], t))
      ];
      const color2 = [
        Math.round(lerp(c1[1][0], c2[1][0], t)),
        Math.round(lerp(c1[1][1], c2[1][1], t)),
        Math.round(lerp(c1[1][2], c2[1][2], t))
      ];
      return `linear-gradient(120deg, rgb(${color1.join(',')}), rgb(${color2.join(',')}))`;
    }

    function animateGradient() {
      step++;
      if (step > steps) {
        step = 0;
        current = next;
        next = (next + 1) % gradients.length;
      }
      const t = step / steps;
      document.body.style.background = getGradient(gradients[current], gradients[next], t);
      requestAnimationFrame(animateGradient);
    }
    animateGradient();

    // Formani yuborish
    const form = document.getElementById('registerForm');
    const successMsg = document.getElementById('successMsg');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      successMsg.style.display = 'block';
      form.reset();
      setTimeout(() => {
        successMsg.style.display = 'none';
      }, 4000);
    });
  </script>
</body>
</html>
